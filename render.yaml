# Deploy do app do prestador no Render (Static Site), via Blueprint.
services:
  - type: web
    name: resolvai-prestador
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # VITE_API_BASE_URL fica vazio: o app chama /api na própria origem e o Render encaminha para a API
      # (regra abaixo). Assim não é preciso liberar este endereço em CORS_ALLOWED_ORIGINS da API.
    routes:
      # Proxy reverso para a API no Render (mesma origem, sem CORS).
      - type: rewrite
        source: /api/*
        destination: https://resolvai-api.onrender.com/api/*
      # O React Router controla as rotas no navegador: qualquer outro caminho serve o index.html.
      - type: rewrite
        source: /*
        destination: /index.html
